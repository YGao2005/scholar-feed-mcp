# Docker MCP Registry entry for Scholar Feed.
#
# Submit by copying this file to servers/scholar-feed/server.yaml in a fork of
# https://github.com/docker/mcp-registry and opening a PR. Docker builds the
# image (mcp/scholar-feed) from the Dockerfile at the root of the source repo,
# runs it, and verifies the MCP server can list tools.
#
# To regenerate/validate locally from a clone of docker/mcp-registry:
#   task wizard
# or validate a hand-written entry with the repo's own tooling before the PR.
#
# NOTE: `source.commit` must point at a real commit on the default branch of the
# source repo at submission time. The value below is a placeholder captured from
# the current build branch and MUST be refreshed by the operator once the
# Dockerfile/.dockerignore land on main.
name: scholar-feed
image: mcp/scholar-feed
type: server
meta:
  category: productivity
  tags:
    - research
    - papers
    - arxiv
    - search
    - citations
    - ai
    - machine-learning
about:
  title: Scholar Feed
  description: >-
    A research copilot over 600,000+ CS/AI/ML papers: semantic search,
    citation-graph traversal, co-author graphs, full-text extraction,
    foundational-lineage lookup, text embeddings, and saved libraries,
    collections, and standing watches. Works anonymously at 100 calls/day,
    or 1,000/day with a free API key.
  icon: https://avatars.githubusercontent.com/u/9919?s=200&v=4
source:
  project: https://github.com/YGao2005/scholar-feed-mcp
  branch: main
  # Placeholder — refresh to the real default-branch commit before submitting.
  commit: 882809ed55e87b016222700afd1ff919a35741a4
config:
  description: >-
    Optional. Scholar Feed runs anonymously (100 calls/day) with no
    configuration. To raise limits to 1,000 calls/day, supply a free API key
    from https://www.scholarfeed.org/settings as the SF_API_KEY secret.
  secrets:
    - name: scholar-feed.api_key
      env: SF_API_KEY
      example: sf_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      description: >-
        Optional Scholar Feed API key (sf_...). Leave unset for anonymous mode.
        Get a free key at https://www.scholarfeed.org/settings.
