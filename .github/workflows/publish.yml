name: Publish

# Tag-triggered npm publish (OIDC trusted publishing) + MCP Registry publish.
# Cut a release by bumping package.json, committing, then pushing a matching tag:
#   npm version <patch|minor|major> && git push --follow-tags
#
# One-time setup on npmjs.com (package -> Settings -> Trusted Publisher):
#   provider GitHub Actions, organization/user "YGao2005",
#   repository "scholar-feed-mcp", workflow filename "publish.yml".
# Auth is then minted per-run via the id-token permission below -- no secret.
#
# Three jobs so the OIDC-privileged runners each do as little as possible:
#   - verify:   UNPRIVILEGED (no id-token) -- lint/build/test on the tagged commit.
#   - publish:  npm. id-token: write for npm trusted publishing only; checkout,
#               build, publish. Runs `npm ci --ignore-scripts` so a malicious
#               transitive dependency's install script can never run there.
#   - registry: official MCP Registry (registry.modelcontextprotocol.io). Its own
#               minimal id-token: write runner -- downloads the official
#               mcp-publisher, authenticates via GitHub OIDC (no stored secret;
#               the OIDC identity authorizes the io.github.YGao2005/* namespace),
#               and publishes server.json. server.json's version is synced from
#               package.json at publish time, so the registry can never drift
#               behind npm again -- that drift is what left the registry pinned
#               to a stale version while npm moved ahead.
#
# Manual re-sync: trigger this workflow with "Run workflow" (workflow_dispatch)
# to publish the CURRENT server.json to the MCP Registry without cutting an npm
# release. npm publish is skipped on dispatch (it cannot republish an existing
# version); only the registry job runs.
#
# 🔴 THIS ONLY WORKS FOR A VERSION THE REGISTRY HAS NOT SEEN. server.json's
# version is synced from package.json at publish time, so a dispatch on an
# already-published version fails with
#   400 {"message":"invalid version: cannot publish duplicate version"}
# and burns four retries getting there. Measured 2026-09-06 trying to re-sync a
# changed `remotes` URL at 3.19.0. The registry has no update-in-place: ANY
# change to server.json -- a description, a remote URL, an env-var doc -- needs a
# version bump. Cut a patch release instead; dispatch is only useful when a tag
# push published npm but the registry job failed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify tag matches package.json version
        # Only meaningful on a tag push; a manual dispatch carries no version tag.
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ($PKG_VERSION)"
            exit 1
          fi
      - run: npm run lint
      - run: npm run build
      - run: npm test

  publish:
    needs: verify
    # npm cannot republish an existing version, so only run on a release tag.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the short-lived OIDC token npm authenticates with
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing requires npm >= 11.5.1 and Node 20 ships npm 10, so
          # this job needs a newer Node than the `verify` matrix (which tests the
          # package's own >=18 support floor). Node 24 ships npm 11.13, clearing
          # the floor without installing anything.
          #
          # Do NOT go back to `npm install -g npm@latest` on Node 20: that is a
          # time bomb. It broke the 3.13.0 publish when npm@latest became npm 12,
          # which requires Node >=22 and refused to install with EBADENGINE.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # --ignore-scripts: no install script runs in the OIDC-privileged runner.
      # The build is invoked explicitly below (prepublishOnly is skipped because
      # the package is already built -- `npm publish --ignore-scripts` is implied
      # by the build step + files allowlist).
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Keep --provenance explicit -- don't rely on the auto-provenance default.
      - run: npm publish --provenance --access public --ignore-scripts

  registry:
    # Publish (or re-sync) server.json to the official MCP Registry. Runs after a
    # successful npm publish on a tag push, OR standalone on a manual dispatch.
    needs: [publish]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> MCP Registry; authorizes io.github.YGao2005/*, no stored secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Derive the registry version from package.json (the source of truth that
      # `npm version` bumps and `verify` ties the tag to) and stamp it onto both
      # the top-level entry and every package reference, so the registry listing
      # always matches the npm release. jq is preinstalled on ubuntu runners.
      - name: Sync server.json version from package.json
        run: |
          VERSION="$(jq -r .version package.json)"
          jq --arg v "$VERSION" '.version = $v | (.packages[]?.version) = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "server.json synced to version $VERSION:"
          jq '{name, version, package_version: .packages[0].version}' server.json
      # Official MCP Registry publisher CLI. The registry is in preview, so track
      # the latest release for protocol compatibility rather than pinning a build.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Wait for the npm version to be readable
        # The registry validates package ownership by FETCHING the version from npm, and
        # npm's publish is asynchronous — `npm publish` prints "Your package is being
        # processed and may take a few minutes to become available" and returns success
        # long before a GET succeeds.
        #
        # MEASURED on the 3.14.0 release (2026-08-26): npm publish succeeded at 09:01,
        # and GET /scholar-feed-mcp/3.14.0 returned 404 until ~09:22 — 21 MINUTES. The
        # old retry budget here was 4 x 20s = 82s, so the registry job failed while the
        # npm release itself was perfectly fine. That is a confusing failure: a red
        # workflow on a release that shipped.
        #
        # Poll the version endpoint directly (not the packument, which is CDN-cached)
        # before attempting to publish, so a slow npm shows up as waiting rather than as
        # four identical validation errors.
        run: |
          VERSION="$(jq -r .version package.json)"
          for i in $(seq 1 60); do    # 60 x 30s = 30 min
            CODE="$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/scholar-feed-mcp/${VERSION}")"
            if [ "$CODE" = "200" ]; then
              echo "npm has ${VERSION} (after $(( (i - 1) * 30 ))s)."
              exit 0
            fi
            echo "npm does not serve ${VERSION} yet (HTTP ${CODE}); waiting 30s (${i}/60)..."
            sleep 30
          done
          echo "::error::npm never served ${VERSION} within 30 minutes."
          echo "The npm publish itself may still have SUCCEEDED — check the publish job."
          echo "If so, do NOT re-tag ${VERSION} (npm refuses to republish a version);"
          echo "re-run this workflow via workflow_dispatch once npm serves it."
          exit 1
      - name: Publish server.json to MCP Registry
        # Retries kept as a thin backstop for a transient registry-side error. The npm
        # propagation race — which is what actually bit us — is handled by the wait above.
        run: |
          for attempt in 1 2 3 4; do
            if ./mcp-publisher publish; then
              echo "Published server.json to the MCP Registry."
              exit 0
            fi
            echo "Publish attempt ${attempt} failed; retrying in 20s..."
            sleep 20
          done
          echo "MCP Registry publish failed after retries."
          exit 1
